# Production broker configuration for the mqtt2bdd stack.
# The development broker (dev/mosquitto/mosquitto.conf) is the same two directives
# without persistence; everything below is what production adds.

# Listen on the standard MQTT port on every interface in the container.
listener 1883

# Anonymous access. The deployment target is a private home LAN with no public
# exposure, which is the threat model docs/architecture/security.md#threat-model
# assumes, and which docs/architecture/infrastructure-and-deployment.md#environments
# already sanctions for the production broker ("anonymous access or authentication").
#
# WHAT THIS MEANS IN PRACTICE: anyone who can reach the published MQTT port can
# publish to any topic and subscribe to every topic, with no credential. Because
# mqtt2bdd subscribes to '#', anyone who can reach it can also write rows into
# sensor_metrics. Do not expose MQTT_HOST_PORT beyond the trusted LAN.
#
# To require credentials instead: create a password file with mosquitto_passwd,
# mount it, set `password_file` and `allow_anonymous false` here, then set
# MQTT_USERNAME and MQTT_PASSWORD in .env.prod — the application side is already
# built (internal/config/config.go:83-84, internal/mqtt/client.go:53-55).
allow_anonymous true

# Survive a restart: retained messages and queued QoS 1/2 state are written to the
# mqtt2bdd-prod-mosquitto-data volume rather than lost with the container.
persistence true
persistence_location /mosquitto/data/

# Log to stdout so `docker logs mqtt2bdd-prod-mosquitto` is the single place to look,
# and so the container's json-file log rotation bounds broker logs too.
log_dest stdout
