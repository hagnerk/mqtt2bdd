schema: 1
story: '4.3'
story_title: 'Automate Cross-Platform Binary Builds on Tag'
gate: CONCERNS
status_reason: >-
  Thirteen of fourteen ACs met and independently re-verified. The workflow's substantive claims were
  not accepted on the strength of plausible-looking YAML: the build and packaging pipeline was
  reproduced outside CI, each binary's GOOS/GOARCH/GOARM/CGO_ENABLED read back from its own embedded
  build settings, and the canonical/alias byte-identity and the 8-lines/4-hashes checksum property
  measured rather than argued. AC14 (TEST-001) is closed with real evidence after being open since
  gate 3.3. One low-severity latent defect found and fixed during review (CI-001: staticcheck invoked
  by bare name, depending on $GOPATH/bin being on PATH — a dependency on runner behaviour that would
  have surfaced only on a tagged release). The gate is CONCERNS solely because AC12, the end-to-end
  rehearsal, requires a GitHub repository that does not exist under PUB-001. Two of AC12's four
  assertions are already locally pre-verified, so what remains untested is the runner environment and
  the release-creation path, not the build or packaging logic.
reviewer: 'Quinn (Test Architect)'
updated: '2026-07-29T00:00:00Z'

waiver: { active: false }

top_issues:
  - id: 'PUB-002'
    severity: medium
    finding: >-
      AC12 is not met. The end-to-end rehearsal on a v0.9.0-rc1 tag requires a workflow run on
      GitHub's runners against a repository that does not exist, because Story 4.2's ACs 6-8 are
      deferred under PUB-001. No tag was created and nothing was pushed. This is an inherited
      dependency, not a defect in this story's work, and it is scoped honestly: the Dev Agent Record
      splits AC12's four assertions into the two already exercised locally (canonical/alias share a
      SHA-256; the extracted binary logs the injected version) and the two that genuinely need a
      runner (the run succeeds; nine assets present).
    suggested_owner: maintainer
    refs: ['docs/stories/4.3.story.md#ac12-not-done-handed-over']

resolved_issues:
  - id: 'CI-001'
    severity: low
    finding: >-
      Latent, would have failed only on a tagged release. The Staticcheck step ran
      `go install honnef.co/go/tools/cmd/staticcheck@v0.6.1` and then invoked `staticcheck ./...` by
      bare name. `go install` places the binary in $(go env GOPATH)/bin, and whether that directory
      is on PATH is a property of the runner image and of actions/setup-go's current behaviour, not
      something this workflow controls. It works today; nothing in the file makes it keep working,
      and the failure would appear as "staticcheck: command not found" during a release run.
    resolution: >-
      Changed to invoke the absolute path, "$(go env GOPATH)/bin/staticcheck" ./..., with the
      reasoning in a comment. Costs nothing and removes the dependency on undocumented runner
      behaviour for a gate whose whole purpose is to block bad releases. Workflow re-parsed clean
      after the edit.
    verified_by: 'Quinn (Test Architect), 2026-07-29'
  - id: 'TEST-001'
    severity: low
    finding: >-
      Open since gate 3.3: test/run-integration-tests.sh's AC9 non-zero-exit path was accepted on the
      Dev's account and never independently exercised. Its consequence changed with this story, since
      AC2 puts that exit code in front of every release.
    resolution: >-
      Closed with evidence, and re-verified by this review from the story's recorded transcript and
      by re-reading the script's control flow. A deliberate one-line breakage on the read side
      (line 49) produced exit code 1 on the intended branch
      ("FAIL: smoke-test message not found in sensor_metrics (rows=0)"), and the trap cleanup EXIT
      still removed every container, the network AND the volumes — the half an exit code alone does
      not prove. The breakage was reverted to a byte-identical file (git diff --stat empty) and the
      unmodified script re-run to exit 0.
    verified_by: 'Quinn (Test Architect), 2026-07-29'

