        and "Tearing down test stack", with the three test containers and the test network removed.
        Build jobs start only after the quality job completed (10:48:13Z -> first build 10:48:16Z).
      ac3_ac4: >-
        Read back from each released binary's embedded build info (go version -m, in the go-dev
        container): linux/amd64, linux/arm64, linux/arm with GOARM=7, darwin/arm64; every one
        CGO_ENABLED=0, -ldflags="-s -w -X main.Version=0.0.9-rc1", vcs.revision 4496553, go1.23.12.
      ac5_ac6_ac8: >-
        Nine assets with exactly the AC5/AC6 names at version 0.0.9-rc1. GitHub's per-asset digests
        pair canonical and alias identically; checksums.txt has 8 lines and 4 distinct hashes and
        `sha256sum -c checksums.txt` reports OK for all eight downloaded archives.
      ac7: >-
        Each canonical archive contains exactly mqtt2bdd (-rwxr-xr-x), LICENSE and README.md, with no
        leading directory. LICENSE and README.md hash identically to the files at commit 4496553.
      ac9: >-
        Release created by github-actions[bot] (the workflow, not a manual upload), log shows
        gh release create ... --generate-notes, body is GitHub's generated "Full Changelog" line.
      ac10: >-
        isPrerelease true. GET releases/latest -> 404, and
        releases/latest/download/mqtt2bdd_linux_amd64.tar.gz -> 404, while the pinned
        releases/download/v0.0.9-rc1/mqtt2bdd_linux_amd64.tar.gz -> 200 (3449980 bytes).
      ac11: >-
        gh secret list and gh variable list empty; 0 environments. The repository's default workflow
        token permission is read, so the workflow's explicit contents:write is what made the release
        possible, which is exactly the reason the file gives for declaring it.
      ac12: >-
        Run 30624610132, attempt 1, conclusion success, all six jobs and every step success. Nine
        assets present. Canonical and alias linux_amd64 share SHA-256 759c68bc...da46. The extracted
        linux/amd64 binary, run in go-dev under amd64 emulation, logs
        event=starting version=0.0.9-rc1 as its first line (the linux/arm64 binary, run natively,
        logs the same). No v1.0.0 tag exists. Tag deviation: REQ-001.
      workflow_identity: >-
        .github/workflows/release.yml has the same blob (ed904a3) at 4496553, the rehearsed commit,
        and at HEAD, so the rehearsal validated the file as it stands.

nfr_validation:
  security:
    status: PASS
    notes: >-
      Confirmed on the live repository rather than from the file: no repository secret, no variable,
      no environment. The default token is read-only and the workflow's explicit contents:write was
      sufficient and necessary. The release was authored by github-actions[bot], so what users
      download is what the gated workflow built. First-party actions only.
  performance:
    status: PASS
    notes: >-
      Whole run 4m21s (10:44:54Z -> 10:49:15Z): quality gates 3m17s, the four builds in parallel in
      about 40s, publication 10s.
  reliability:
    status: PASS
    notes: >-
      The gate ordering held on a real runner; the integration suite passed on GitHub's Docker and
      tore its stack down. CI-002 is the one runner-dependency left to address before v1.0.0.
  maintainability:
    status: PASS
    notes: 'Unchanged since the 2026-07-29 review; release.yml is byte-identical to the rehearsed version.'

