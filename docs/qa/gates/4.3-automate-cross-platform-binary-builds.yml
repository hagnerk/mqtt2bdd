schema: 1
story: '4.3'
story_title: 'Automate Cross-Platform Binary Builds on Tag'
gate: PASS
status_reason: >-
  All fourteen ACs are met. AC12 was verified against the maintainer's 2026-07-31 rehearsal, and the
  workflow has since been re-proven on a runner: the v0.0.9-rc2 run (35008908643) exercised the
  Node.js 24 action majors end to end with zero deprecation warnings, Go resolved to go1.23.12 under
  GOTOOLCHAIN=local, the new artifact digest check active, nine assets, all checksums verified, and
  the released binaries reporting the injected version. CI-002 is resolved. One low item remains
  (REQ-001): both rehearsals used a v0.0.9-rcN tag rather than the v0.9.0-rc1 AC12 names, which
  is the PO's to accept.
reviewer: 'Quinn (Test Architect)'
updated: '2026-09-15T00:00:00Z'

waiver: { active: false }

top_issues:
  - id: 'REQ-001'
    severity: low
    finding: >-
      AC12 names the rehearsal tag v0.9.0-rc1 and the expected log line version=0.9.0-rc1. The
      maintainer rehearsed on v0.0.9-rc1 (2026-07-31) and again on v0.0.9-rc2 (2026-09-15), so every
      release, archive name and logged version reads 0.0.9-rcN. Every one of AC12's four assertions
      holds with that version substituted, both tags carry the pre-release suffix the rehearsal
      exists to exercise, and no v1.0.0 exists yet. The deviation is in the literal tag only, and it
      is now a consistent choice rather than a slip. It is recorded rather than silently read as
      equivalent, because this project does not reinterpret ACs. Side effect: v0.0.9-rc1 is a
      permanent module version on proxy.golang.org; harmless, not reversible.
    suggested_action: >-
      PO to record in a post-publication validation that AC12 is accepted with the v0.0.9-rcN
      rehearsals in place of v0.9.0-rc1. No further rehearsal is needed for the workflow's sake:
      rc2 already validated the current release.yml on a runner.
    suggested_owner: po
    refs: ['docs/stories/4.3.story.md#post-publication-re-review-2026-09-15']

resolved_issues:
  - id: 'CI-002'
    severity: low
    finding: >-
      Every job in run 30624610132 (v0.0.9-rc1) emitted "Node.js 20 is deprecated":
      actions/checkout@v4, actions/setup-go@v5, actions/upload-artifact@v4 and
      actions/download-artifact@v4 targeted Node.js 20 and were forced onto Node.js 24 by the runner.
      Same shape as CI-001: a dependency on runner behaviour the workflow does not control.
    resolution: >-
      release.yml moved to checkout@v7, setup-go@v7, upload-artifact@v7 and download-artifact@v8,
      each major's runtime read from its action.yml (node24) and each crossed major's release notes
      checked against the workflow's usage (committed in 698235b). Proven on a runner by the
      v0.0.9-rc2 run 35008908643: attempt 1, all six jobs and every step success, steps named with
      the new majors, zero "Node.js 20" lines in the log and zero check-run annotations on any job;
      setup-go resolved spec 1.23 to go1.23.12 with GOTOOLCHAIN=local, and the Staticcheck install
      succeeded under it; download-artifact ran with digest-mismatch: error and expected digests
      listed. The released binaries still report go1.23.12, so the action bump changed nothing in
      the artefacts' toolchain.
    verified_by: 'Quinn (Test Architect), 2026-09-15'
  - id: 'PUB-002'
    severity: medium
    finding: >-
      AC12 not met: the end-to-end rehearsal needed a GitHub repository that did not exist (PUB-001).
    resolution: >-
      Maintainer published the repository and pushed tag v0.0.9-rc1 on 2026-07-31; the workflow ran
      and created the prerelease. Re-verified by QA against the live run, release and assets on
      2026-09-15. Tag-name deviation tracked separately as REQ-001.
    verified_by: 'Quinn (Test Architect), 2026-09-15'
  - id: 'CI-001'
    severity: low
    finding: >-
      Latent, would have failed only on a tagged release. The Staticcheck step ran
      `go install honnef.co/go/tools/cmd/staticcheck@v0.6.1` and then invoked `staticcheck ./...` by
      bare name. `go install` places the binary in $(go env GOPATH)/bin, and whether that directory
      is on PATH is a property of the runner image and of actions/setup-go's current behaviour, not
      something this workflow controls. It works today; nothing in the file makes it keep working,
      and the failure would appear as "staticcheck: command not found" during a release run.
    resolution: >-
      Changed to invoke the absolute path, "$(go env GOPATH)/bin/staticcheck" ./..., with the
      reasoning in a comment. Costs nothing and removes the dependency on undocumented runner
      behaviour for a gate whose whole purpose is to block bad releases. Workflow re-parsed clean
      after the edit. Confirmed on a real runner on 2026-07-31 and again on 2026-09-15 under
      setup-go@v7: the Staticcheck step succeeded both times.
    verified_by: 'Quinn (Test Architect), 2026-07-29; re-confirmed 2026-09-15'
  - id: 'TEST-001'
    severity: low
    finding: >-
      Open since gate 3.3: test/run-integration-tests.sh's AC9 non-zero-exit path was accepted on the
      Dev's account and never independently exercised. Its consequence changed with this story, since
      AC2 puts that exit code in front of every release.
    resolution: >-
      Closed with evidence, and re-verified by this review from the story's recorded transcript and
      by re-reading the script's control flow. A deliberate one-line breakage on the read side
      (line 49) produced exit code 1 on the intended branch
      ("FAIL: smoke-test message not found in sensor_metrics (rows=0)"), and the trap cleanup EXIT
      still removed every container, the network AND the volumes — the half an exit code alone does
      not prove. The breakage was reverted to a byte-identical file (git diff --stat empty) and the
      unmodified script re-run to exit 0.
    verified_by: 'Quinn (Test Architect), 2026-07-29'

