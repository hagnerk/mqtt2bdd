schema: 1
story: '4.3'
story_title: 'Automate Cross-Platform Binary Builds on Tag'
gate: PASS
status_reason: >-
  All fourteen ACs are now met. AC12, open under PUB-002 since 2026-07-29, was verified against the
  live rehearsal the maintainer ran on 2026-07-31: workflow run 30624610132 succeeded on its first
  attempt with every job and step green, including the integration suite and its teardown; the
  prerelease carries the nine expected assets; all eight archives verify against checksums.txt with
  four distinct hashes; and the extracted linux/amd64 binary logs event=starting with the injected
  version. The rehearsal ran on v0.0.9-rc1 rather than the v0.9.0-rc1 the AC names (REQ-001, low); no
  assertion depends on the digits. One low CI item (CI-002): four actions target the deprecated
  Node.js 20 runtime.
reviewer: 'Quinn (Test Architect)'
updated: '2026-09-15T00:00:00Z'

waiver: { active: false }

top_issues:
  - id: 'REQ-001'
    severity: low
    finding: >-
      AC12 names the rehearsal tag v0.9.0-rc1 and the expected log line version=0.9.0-rc1. The
      maintainer rehearsed on v0.0.9-rc1, so the release, the archive names and the logged version
      all read 0.0.9-rc1. Every one of AC12's four assertions holds with that version substituted,
      the tag carries the pre-release suffix the rehearsal exists to exercise, and no v1.0.0 exists
      yet, so "before v1.0.0 is tagged" holds too. The deviation is in the literal tag only. It is
      recorded rather than silently read as equivalent, because this project does not reinterpret
      ACs. Side effect: v0.0.9-rc1 is now a permanent module version on proxy.golang.org, and @latest
      resolves to it until a release version exists; harmless, not reversible.
    suggested_action: >-
      PO to record in a post-publication validation that AC12 is accepted with v0.0.9-rc1 in place
      of v0.9.0-rc1. A second rehearsal only to match the literal tag is not recommended on its own
      (release.yml is byte-identical to the rehearsed version), but see CI-002: if the actions are
      bumped before v1.0.0, a fresh rc rehearsal is warranted anyway and can use v0.9.0-rc1.
    suggested_owner: po
    refs: ['docs/stories/4.3.story.md#post-publication-re-review-2026-09-15']
  - id: 'CI-002'
    severity: low
    finding: >-
      Every job in run 30624610132 emitted "Node.js 20 is deprecated": actions/checkout@v4,
      actions/setup-go@v5, actions/upload-artifact@v4 and actions/download-artifact@v4 target Node.js
      20 and are being forced onto Node.js 24 by the runner. The run succeeded, so this is not a
      defect today. It has the same shape as CI-001: the workflow depends on runner behaviour it does
      not control, and the only place a change would surface is a tagged release run.
    suggested_action: >-
      Before tagging v1.0.0, move each action to its current major that targets Node.js 24 (check
      each action's release notes rather than guessing numbers), then rehearse again on an rc tag,
      since changing the actions invalidates the part of the rehearsal that validated the runner
      environment.
    suggested_owner: dev
    refs: ['.github/workflows/release.yml']

resolved_issues:
  - id: 'PUB-002'
    severity: medium
    finding: >-
      AC12 not met: the end-to-end rehearsal needed a GitHub repository that did not exist (PUB-001).
    resolution: >-
      Maintainer published the repository and pushed tag v0.0.9-rc1 on 2026-07-31; the workflow ran
      and created the prerelease. Re-verified by QA against the live run, release and assets on
      2026-09-15. Tag-name deviation tracked separately as REQ-001.
    verified_by: 'Quinn (Test Architect), 2026-09-15'
  - id: 'CI-001'
    severity: low
    finding: >-
      Latent, would have failed only on a tagged release. The Staticcheck step ran
      `go install honnef.co/go/tools/cmd/staticcheck@v0.6.1` and then invoked `staticcheck ./...` by
      bare name. `go install` places the binary in $(go env GOPATH)/bin, and whether that directory
      is on PATH is a property of the runner image and of actions/setup-go's current behaviour, not
      something this workflow controls. It works today; nothing in the file makes it keep working,
      and the failure would appear as "staticcheck: command not found" during a release run.
    resolution: >-
      Changed to invoke the absolute path, "$(go env GOPATH)/bin/staticcheck" ./..., with the
      reasoning in a comment. Costs nothing and removes the dependency on undocumented runner
      behaviour for a gate whose whole purpose is to block bad releases. Workflow re-parsed clean
      after the edit. Confirmed on a real runner on 2026-07-31: the Staticcheck step succeeded.
    verified_by: 'Quinn (Test Architect), 2026-07-29; re-confirmed 2026-09-15'
  - id: 'TEST-001'
    severity: low
    finding: >-
      Open since gate 3.3: test/run-integration-tests.sh's AC9 non-zero-exit path was accepted on the
      Dev's account and never independently exercised. Its consequence changed with this story, since
      AC2 puts that exit code in front of every release.
    resolution: >-
      Closed with evidence, and re-verified by this review from the story's recorded transcript and
      by re-reading the script's control flow. A deliberate one-line breakage on the read side
      (line 49) produced exit code 1 on the intended branch
      ("FAIL: smoke-test message not found in sensor_metrics (rows=0)"), and the trap cleanup EXIT
      still removed every container, the network AND the volumes — the half an exit code alone does
      not prove. The breakage was reverted to a byte-identical file (git diff --stat empty) and the
      unmodified script re-run to exit 0.
    verified_by: 'Quinn (Test Architect), 2026-07-29'

