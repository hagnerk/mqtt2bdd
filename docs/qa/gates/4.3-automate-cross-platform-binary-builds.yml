nfr_validation:
  security:
    status: PASS
    notes: >-
      permissions declared at workflow level as contents:write and nothing broader, so the workflow
      cannot silently inherit a wider default. grep for "secrets." across the file returns no match;
      the only token reference is GH_TOKEN via github.token. Every `uses:` is a first-party
      actions/* action (checkout@v4, setup-go@v5, upload-artifact@v4, download-artifact@v4) —
      verified by reading them out of the parsed document, not by scanning the text. Creating the
      release with the preinstalled gh CLI rather than a third-party action is the right call for a
      workflow whose entire output is artefacts other people download and execute: it adds nothing
      to the supply chain. Note the release job deliberately has no checkout step and passes
      --repo "${GITHUB_REPOSITORY}" explicitly, which is what makes gh's repo detection unnecessary —
      checked rather than assumed.
  performance:
    status: PASS
    notes: >-
      Four matrix jobs run in parallel with fail-fast:false, so one broken platform reports one
      failure instead of masking the state of the other three — and the release job still cannot run,
      because needs:build requires every matrix leg to succeed. setup-go's module caching is on by
      default. Artifact retention is 1 day, appropriate for a hand-off between jobs in the same run.
  reliability:
    status: PASS
    notes: >-
      AC2's guarantee is structural rather than conventional: needs: is a hard dependency, so a
      failing gate cannot be overridden by remembering to check. No continue-on-error anywhere.
      The gofmt step correctly inspects the output rather than trusting the exit code — gofmt -l
      exits 0 even when it lists files, so a bare step would have been a gate that can never fail.
      The checksum step asserts 8 lines and 4 distinct hashes rather than just writing the file,
      which is what would catch a regression in the aliasing before publication rather than after.
      The Package step verifies LICENSE and README.md exist rather than assuming, so a missing
      licence cannot ship silently in every archive of every release. An empty GOARM (what the
      matrix passes for the three non-ARM targets) was verified not to break the build — a CI-only
      failure mode otherwise.
  maintainability:
    status: PASS
    notes: >-
      144 comment lines in 286. Every job states what depends on it; each non-obvious step carries
      its rationale, and nothing restates the obvious (actions/checkout@v4 has no comment, correctly).
      The matrix name fragment is data rather than derived from GOOS/GOARCH, with the reason
      commented — deriving it would produce linux_arm where AC5 and AC6 both name the file
      linux_armv7. Build flags are byte-for-byte the production Dockerfile's, so a released binary
      and a container-built one cannot diverge.

