nfr_validation:
  security:
    status: PASS
    notes: >-
      No security surface touched — no credential, configuration key, environment variable, or
      network path changed. Independently confirmed that the two gitignored binaries carrying the old
      module path in compiled metadata (__debug_bin262058197, bin/) were not rewritten: the Dev built
      the file list from git ls-files, which cannot reach an ignored path, rather than from a
      recursive grep. This is a genuine improvement over the command form the story suggested, and
      the Dev recorded it as a deviation rather than silently substituting it.
  performance:
    status: PASS
    notes: >-
      Not applicable. An identifier rename produces byte-identical machine code; go test timings are
      unchanged across all five packages.
  reliability:
    status: PASS
    notes: >-
      The load-bearing guarantee is the compiler's, not a test's: a missed import path is a build
      error, and go build ./... is clean. The one occurrence a build cannot catch —
      integration_helpers_test.go:84, which builds the test binary by package path rather than
      importing it — is covered by the integration suite, which was run and passed at exit 0. No
      existing test needed editing, which is the story's own stated signal that the change really was
      mechanical.
  maintainability:
    status: PASS
    notes: >-
      Diff is 34 files, 113 insertions, 113 deletions, perfectly balanced. Verified stronger than
      "looks mechanical": after normalising both tokens, every changed line appears an even number of
      times, so no line differs by anything but the token. docs/architecture/'s deliberate
      github.com/username/mqtt2bdd placeholder was correctly left alone. The PRD count realignment
      was kept in a separate PO commit so AC7's isolation claim is checkable at a glance.

recommendations:
  immediate: []
  future:
    - action: >-
        Story 4.2 must not be started before this commit is the state of main — it publishes the
        module path to a public remote, after which a rename requires a retract directive and cannot
        be made retroactive for anyone who has already fetched. Confirmed still safe today:
        git remote -v and git tag are both empty.
      refs: ['go.mod', 'docs/prd.md']
    - action: >-
        DOC-001 (Story 3.5, non-blocking): the README Architecture-diagram wording nit is still open.
        Stories 4.2 and 4.4 both edit README.md substantially and are its natural homes; this story
        correctly declined it under AC7.
      refs: ['README.md']
    - action: >-
        REL-001 and TEST-001 (Story 3.3, non-blocking) are unchanged and remain unowned. This story
        runs test/run-integration-tests.sh but does not touch it, so TEST-001's "next time the script
        is touched" trigger did not fire. Story 4.3 wires that same script into CI and is the next
        realistic opportunity.
      refs: ['test/run-integration-tests.sh', 'cmd/mqtt2bdd/main.go']

