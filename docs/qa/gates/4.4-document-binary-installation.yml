        Suggested order before v1.0.0, combining open items across gates 4.3 and 4.4: bump the
        Node.js 20 actions (CI-002), rehearse on v0.9.0-rc1 (settles REQ-001 going forward), tag
        v1.0.0, then walk the latest path end to end to close PUB-003.
      refs: ['docs/qa/gates/4.3-automate-cross-platform-binary-builds.yml']
    - action: >-
        REL-001 (gate 3.3) remains unowned and not actionable.
      refs: ['cmd/mqtt2bdd/main.go']

