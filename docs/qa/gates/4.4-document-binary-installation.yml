schema: 1
story: '4.4'
story_title: 'Document Binary Installation from a GitHub Release'
gate: PASS
status_reason: >-
  All eleven ACs are met. AC10 closes with v1.0.0, the first release that is not a pre-release:
  every URL and command in the Installation section was run against it. The latest path, the pinned
  path and the version-range pattern all download, verify and extract as documented, on macOS and
  through the BusyBox fallback. The released binaries produce exactly the two first-run outputs the
  README now documents. PUB-003 is resolved. The three documentation defects found on 2026-09-15
  (DOC-003/004/005) were fixed, published in 2808b65, and ship inside every v1.0.0 archive.
reviewer: 'Quinn (Test Architect)'
updated: '2026-09-15T00:00:00Z'

waiver: { active: false }

top_issues: []

resolved_issues:
  - id: 'PUB-003'
    severity: medium
    finding: >-
      AC10 partly unverified: the latest URLs could not resolve while no non-pre-release existed
      (first blocked by PUB-001, then by the absence of v1.0.0), and "follows the newest
      non-pre-release" could not be observed.
    resolution: >-
      v1.0.0 published on 2026-09-15 (run 35010177508, release not marked pre-release, GitHub
      "Latest"). GET releases/latest -> v1.0.0. The four latest alias URLs and latest checksums.txt
      redirect to download/v1.0.0/<name> and serve 200 with the release asset sizes. The Latest path
      walked exactly as written on macOS: both downloads exit 0, sha256sum --ignore-missing -c prints
      "mqtt2bdd_darwin_arm64.tar.gz: OK", tar extracts, and the latest archive is byte-identical to
      the pinned v1.0.0 alias. Pre-release exclusion was observed across time: earlier the same day,
      with v0.0.9-rc2 as the newest tag, every latest URL returned 404; once v1.0.0 existed, latest
      resolved to it and not to either rc. What remains unobservable until a second release ships is
      latest moving on to it, which is GitHub platform behaviour rather than a claim about this
      project's artefacts; recorded as an observation, not an open item.
    verified_by: 'Quinn (Test Architect), 2026-09-15'
  - id: 'DOC-003'
    severity: medium
    finding: >-
      Every download command in the Installation section was `curl -LO` without `-f`. On an HTTP
      error curl saved the error body under the requested filename and exited 0. Walked as written on
      2026-09-15, the Latest path produced two 9-byte "Not Found" files, the macOS verify step exited
      0 with only a warning, and the failure first surfaced at tar as an archive-format error. The
      version-range pattern did the same, and did not guard an empty TAG.
    resolution: >-
      All six curl invocations use -f, with the reason stated; the range pattern guards an empty
      TAG. Verified on 2026-09-15 against the 404s, and again against v1.0.0, where the snippet run as
      written resolves TAG=v1.0.0, downloads mqtt2bdd_1.0.0_linux_amd64.tar.gz and verifies it OK.
    verified_by: 'Quinn (Test Architect), 2026-09-15'
  - id: 'DOC-004'
    severity: low
    finding: >-
      Extract and run showed a bare ./mqtt2bdd printing event=starting, and What the binary still
      needs said an unconfigured binary logs event=starting and then fails to connect. main.go loads
      configuration at :200 and exits at :203, before the starting log at :210.
    resolution: >-
      Both outcomes documented. Re-verified with the v1.0.0 linux_amd64 binary under `env -i`: the
      bare run prints only config_load_failed (MQTT_BROKER is not set), exit 1; with the required
      variables and an unreachable broker it logs event=starting version=1.0.0, then
      startup_aborted, exit 1.
    verified_by: 'Quinn (Test Architect), 2026-09-15'
  - id: 'DOC-005'
    severity: low
    finding: >-
      `xattr -d com.apple.quarantine ./mqtt2bdd` failed with "No such xattr", exit 1, after the
      README's own curl download.
    resolution: >-
      Scoped to browser downloads and made idempotent (`2>/dev/null || true`). Re-verified on the
      v1.0.0 latest download: exit 0.
    verified_by: 'Quinn (Test Architect), 2026-09-15'
  - id: 'DOC-002'
    severity: medium
    finding: >-
      User-facing, and the kind of defect that only appears when the section is read as a sequence
      rather than as parts. The Download subsection documents two paths, pinned and latest, and says
      the choice matters. Every subsequent command then assumed the pinned path, so a reader who
      followed the latest URL would have fetched a checksum file from a different release.
    resolution: >-
      Verify gives both checksums.txt URLs and explains why either download verifies. Confirmed on
      the real v1.0.0 release: the latest checksums.txt verifies the latest (alias) archive, and the
      BusyBox fallback prints OK for both the canonical and the alias name.
    verified_by: 'Quinn (Test Architect), 2026-07-31; re-confirmed 2026-09-15 on v0.0.9-rc1 and v1.0.0'

