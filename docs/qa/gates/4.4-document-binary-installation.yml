schema: 1
story: '4.4'
story_title: 'Document Binary Installation from a GitHub Release'
gate: CONCERNS
status_reason: >-
  Ten of eleven ACs met and independently re-verified; AC10 is met on 11 of its 13 claims, with the
  two exceptions precisely stated rather than glossed. The documented commands were run rather than
  reviewed, all eight archive names were matched against the workflow by script in both directions,
  and every claim the README makes about the release workflow was cross-checked against
  .github/workflows/release.yml. One genuine user-facing defect found and fixed during review
  (DOC-002): every command after the Download subsection silently assumed the pinned download path,
  so a reader who followed the documented "latest" URL was sent to the wrong release's checksums.txt
  and given filenames they did not have. The gate is CONCERNS because AC10's URL-resolution half
  remains unverifiable under PUB-001, not because of the quality of what was delivered.
reviewer: 'Quinn (Test Architect)'
updated: '2026-07-31T00:00:00Z'

waiver: { active: false }

top_issues:
  - id: 'PUB-003'
    severity: medium
    finding: >-
      AC10 is met in part. Eleven of its thirteen claims were verified by execution; two cannot be:
      that releases/download/<tag>/<name> and releases/latest/download/<name> actually serve (and
      that latest follows the newest non-pre-release, which additionally needs two releases to
      exist), and that a downloaded macOS binary carries the Gatekeeper quarantine attribute. Both
      are blocked by PUB-001. The URLs are correct by construction — repository path from go.mod,
      filenames script-matched against the workflow — but correct-by-construction is not fetched.
    suggested_owner: maintainer
    refs: ['docs/stories/4.4.story.md#ac10-what-was-verified-and-what-was-not']

resolved_issues:
  - id: 'DOC-002'
    severity: medium
    finding: >-
      User-facing, and the kind of defect that only appears when the section is read as a sequence
      rather than as parts. The Download subsection documents two paths, pinned and latest, and says
      the choice matters. Every subsequent command then assumed the pinned path: Verify told the
      reader to fetch checksums.txt from the hardcoded v1.2.3 release, and Verify, the BusyBox
      fallback and Extract all named mqtt2bdd_1.2.3_linux_amd64.tar.gz. A reader who followed the
      latest URL holds mqtt2bdd_linux_amd64.tar.gz and would have fetched a checksum file from a
      different release — producing a verification failure that looks like a corrupted download.
      AC1's promise is copy-pasteable instructions; for one of the two documented paths they were not.
    resolution: >-
      Verify now gives both checksums.txt URLs, states explicitly that it must come from the same
      release as the archive, shows both expected OK lines, and explains why either download
      verifies without knowing about the other — checksums.txt lists every archive under both its
      canonical and its alias name, and the pair is byte-identical so it shares one hash. Extract
      gained a substitute-your-filename sentence. The premise was verified by reproduction, not
      asserted: a release was rebuilt locally and a latest-path user simulated with only the alias
      archive present; verification printed "mqtt2bdd_linux_amd64.tar.gz: OK" and exited 0. Worth
      noting that Story 4.3 AC8 designed for exactly this ("the file lists both names so that either
      download can be verified without knowing about the other") — the capability was already there
      and the README simply failed to use it.
    verified_by: 'Quinn (Test Architect), 2026-07-31'

