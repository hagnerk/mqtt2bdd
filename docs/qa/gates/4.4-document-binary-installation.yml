nfr_validation:
  security:
    status: PASS
    notes: >-
      The checksum guidance is correctly scoped: the README states that a matching checksum shows the
      download is complete and uncorrupted and explicitly does NOT claim it is a signature or proves
      authorship. Overstating what a checksum gives you is the common failure in install docs and it
      was avoided deliberately. The macOS-unsigned reality is stated plainly with the quarantine
      command, rather than left for the user to discover through a dialog that says the file is
      damaged. No credential, endpoint or permission is introduced.
  performance:
    status: PASS
    notes: 'Not applicable — documentation only. Coherence build clean.'
  reliability:
    status: PASS
    notes: >-
      The documented commands were executed, not reviewed. The jq release-selection pipeline was
      validated against a payload built to break it (a newer major, a 1.x pre-release, two 1.x
      releases) and selected correctly. All four uname -m values were confirmed on real platforms
      rather than assumed. The BusyBox claim was verified as a negative first — the option really is
      rejected — before the fallback was documented.
  maintainability:
    status: PASS
    notes: >-
      All eight archive names matched against the workflow by script in both directions, so the
      README cannot name an archive the workflow does not build nor omit one it does. This is the
      right check for a table of near-identical filenames. The release subsection documents how to
      use the workflow and deliberately not its internals, which are commented in the workflow file
      itself — the correct division. The Prerequisites contradiction this story would otherwise have
      introduced was found at draft time and fixed at the correct clause.

recommendations:
  immediate:
    - action: >-
        PUB-003 (maintainer): after PUB-001 and PUB-002, walk the README's Installation section
        end to end against the real release — both the pinned and the latest path, since DOC-002
        showed the two diverge in ways only a sequential read catches.
      refs: ['README.md']
  future:
    - action: >-
        REL-001 (gate 3.3) ends Epic 4 unowned. It needs a behavioural change in healthCheckLoop and
        no Epic 4 story touches Go source. Not actionable today.
      refs: ['cmd/mqtt2bdd/main.go']

