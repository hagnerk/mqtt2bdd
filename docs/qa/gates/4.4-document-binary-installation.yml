    ac_partial: [10]
    ac_gaps: []
    ac_partial_reason: >-
      Latest-URL resolution and its follows-newest behaviour need a non-pre-release that does not
      exist yet. Everything else in AC10 is now verified against the live release.
    re_verification_2026_09_15:
      readme_identity: >-
        Before this review's fixes, README.md blob 95f2b28 was identical at 4496553 (the published
        commit) and at HEAD. The fixes are local and unpublished until committed and pushed.
      pinned_path: >-
        All nine releases/download/v0.0.9-rc1/<name> URLs return 200 with sizes matching the release
        assets. macOS host, in an empty directory holding one downloaded archive:
        `sha256sum --ignore-missing -c` (/sbin/sha256sum) and `shasum -a 256 --ignore-missing -c`
        both print "mqtt2bdd_0.0.9-rc1_darwin_arm64.tar.gz: OK", exit 0. BusyBox (go-dev):
        --ignore-missing rejected as the README says, and the grep fallback prints OK for the canonical
        and for the alias archive. Extraction gives three files, binary -rwxr-xr-x.
      latest_path: >-
        releases/latest/download/{mqtt2bdd_linux_amd64.tar.gz, mqtt2bdd_darwin_arm64.tar.gz,
        checksums.txt} all return 404; GET /releases/latest returns 404. With the corrected commands,
        curl fails on the 404 and leaves no file.
      api_and_range_pattern: >-
        api.github.com/repos/hagnerk/mqtt2bdd/releases returns 1 release (v0.0.9-rc1,
        prerelease true). The jq stage excludes it, correctly. The corrected snippet stops with
        "no matching release", exit 1.
      run: >-
        Released binary under `env -i`: empty environment -> config_load_failed, exit 1; required
        variables set with an unreachable broker -> starting ... startup_aborted, exit 1. Both now
        documented.
      gatekeeper: >-
        curl download: xattrs com.apple.provenance only; codesign Signature=adhoc (linker-signed);
        spctl rejected. Simulated browser quarantine: propagated by tar. The corrected command exits 0
        in both cases and clears the attribute when present. A real browser download was not
        performed, and the darwin binary was deliberately not executed on the maintainer's host.

nfr_validation:
  security:
    status: PASS
    notes: >-
      Checksum guidance still correctly scoped: it verifies integrity, not authorship. With -f,
      a failed checksums.txt download can no longer make verification exit 0 on an error page.
  performance:
    status: PASS
    notes: 'Not applicable — documentation only.'
  reliability:
    status: PASS
    notes: >-
      After the fixes, the documented commands stop at the step that failed, and the documented
      first-run output matches what an unconfigured and a misconfigured user actually see, both
      reproduced with the released binary.
  maintainability:
    status: PASS
    notes: >-
      Archive names, table and release subsection all match the live release exactly. Lesson recorded
      for future verification: run documented binaries with `env -i`, never inside a container
      that carries the dev configuration.

