schema: 1
story: '4.4'
story_title: 'Document Binary Installation from a GitHub Release'
gate: CONCERNS
status_reason: >-
  Post-publication re-review against the live v0.0.9-rc1 release. The pinned path works end to end,
  and the three documentation defects found by walking the Installation section as a user (DOC-003
  silent 404 downloads, DOC-004 wrong first-run output, DOC-005 Gatekeeper step failing after curl)
  were fixed in README.md during this review and re-verified by execution. The gate stays CONCERNS
  for one reason only: AC10's latest URLs cannot resolve until a non-pre-release exists, so PUB-003
  now waits on v1.0.0 rather than on PUB-001.
reviewer: 'Quinn (Test Architect)'
updated: '2026-09-15T00:00:00Z'

waiver: { active: false }

top_issues:
  - id: 'PUB-003'
    severity: medium
    finding: >-
      AC10 remains partly unverified, now on a narrower and different blocker. Verified live: the
      nine pinned URLs, the API endpoint returning this repository's releases, and the jq selection
      excluding the pre-release on real data. Still unverifiable: that releases/latest/download/<name>
      serves, and that it follows the newest non-pre-release. Both need at least one non-pre-release
      (two to demonstrate "follows"); today every latest URL returns 404, which is Story 4.3 AC10
      working as designed. A real browser download (for the quarantine attribute) was simulated,
      not performed.
    suggested_owner: maintainer
    refs: ['docs/stories/4.4.story.md#post-publication-re-review-2026-09-15']

resolved_issues:
  - id: 'DOC-003'
    severity: medium
    finding: >-
      Every download command in the Installation section was `curl -LO` without `-f`. On an HTTP
      error curl saved the error body under the requested filename and exited 0. Walked as written on
      2026-09-15, the Latest path produced two 9-byte "Not Found" files, the macOS verify step exited
      0 with only a warning, and the failure first surfaced at tar as an archive-format error. The
      version-range pattern did the same, and did not guard an empty TAG, so it built
      releases/download//mqtt2bdd__linux_amd64.tar.gz.
    resolution: >-
      All six curl invocations now use -f (-fLO for downloads, -fs for the API call). A sentence
      explains why -f is there, and another states that latest URLs return 404 while only
      pre-releases exist. The range pattern gained `[ -n "$TAG" ] || { echo "no matching release"
      >&2; exit 1; }`, and the rate-limit paragraph now explains how -f and the guard handle an error
      response. Re-verified: latest path -> curl exits non-zero on 404 with no file left behind;
      pinned path -> OK, exit 0; range snippet -> "no matching release", exit 1, no file, both when
      nothing matches and when the API call itself fails.
    verified_by: 'Quinn (Test Architect), 2026-09-15'
  - id: 'DOC-004'
    severity: low
    finding: >-
      Extract and run showed a bare ./mqtt2bdd printing event=starting, and What the binary still
      needs said an unconfigured binary logs event=starting and then fails to connect. main.go loads
      configuration at :200 and exits at :203, before the starting log at :210, so an unconfigured
      run prints only config_load_failed. Missed on 2026-07-31 because the binary ran inside go-dev,
      which carries the dev configuration.
    resolution: >-
      Extract and run now shows the real unconfigured output (config_load_failed naming
      MQTT_BROKER), says it is the expected first result, links to What the binary still needs, and
      shows the starting line as what appears once configured. The needs paragraph now states both
      outcomes: no variables -> immediate config_load_failed; variables set but broker or database
      unreachable -> starting, then startup_aborted, non-zero exit. Both outputs were reproduced with
      the released linux_arm64 binary under `env -i` in go-dev: empty environment -> config_load_failed,
      exit 1; required variables pointing at 127.0.0.1:1 -> starting, config_loaded, connecting,
      connect_failed, startup_aborted, exit 1.
    verified_by: 'Quinn (Test Architect), 2026-09-15'
  - id: 'DOC-005'
    severity: low
    finding: >-
      `xattr -d com.apple.quarantine ./mqtt2bdd` was presented as required, but after the README's own
      curl download there is no quarantine attribute (only com.apple.provenance), so it failed with
      "No such xattr", exit 1.
    resolution: >-
      The paragraph now explains that browsers quarantine downloads and tar carries the mark onto the
      binary; the command is `xattr -d com.apple.quarantine ./mqtt2bdd 2>/dev/null || true`, followed
      by a sentence noting curl does not set the attribute. Re-verified: exit 0 on a curl-downloaded
      binary, and exit 0 with the attribute actually cleared on a binary carrying a quarantine
      attribute.
    verified_by: 'Quinn (Test Architect), 2026-09-15'
  - id: 'DOC-002'
    severity: medium
    finding: >-
      User-facing, and the kind of defect that only appears when the section is read as a sequence
      rather than as parts. The Download subsection documents two paths, pinned and latest, and says
      the choice matters. Every subsequent command then assumed the pinned path: Verify told the
      reader to fetch checksums.txt from the hardcoded v1.2.3 release, and Verify, the BusyBox
      fallback and Extract all named mqtt2bdd_1.2.3_linux_amd64.tar.gz. A reader who followed the
      latest URL holds mqtt2bdd_linux_amd64.tar.gz and would have fetched a checksum file from a
      different release — producing a verification failure that looks like a corrupted download.
      AC1's promise is copy-pasteable instructions; for one of the two documented paths they were not.
    resolution: >-
      Verify now gives both checksums.txt URLs, states explicitly that it must come from the same
      release as the archive, shows both expected OK lines, and explains why either download
      verifies without knowing about the other — checksums.txt lists every archive under both its
      canonical and its alias name, and the pair is byte-identical so it shares one hash. Extract
      gained a substitute-your-filename sentence. The premise was verified by reproduction, not
      asserted. Re-confirmed on the real release on 2026-09-15: the alias archive alone verifies OK
      through the BusyBox fallback.
    verified_by: 'Quinn (Test Architect), 2026-07-31; re-confirmed 2026-09-15'

