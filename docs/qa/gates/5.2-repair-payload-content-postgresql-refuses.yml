  risks_identified: 3
  trace:
    ac_covered: [1, 2, 3, 4, 5, 6, 7, 8]
    ac_partial: []
    ac_gaps: []
    notes: >-
      Tests reviewed: TestSanitizePayload (40 rows), TestSanitizePayload_NoAllocOnCleanPayload,
      TestInsertMessage_Sanitized, TestPayloadRepair, and TestWriteRejection (unchanged, still
      sqlstate=22003 for the unrepairable overflow). AC7 verified by reading the README.
  qa_rerun_2026_09_17: >-
    From dev/: gofmt -l . empty; go vet and staticcheck rc=0 with and without -tags=integration;
    go test -count=1 ./... ok; sanitize.go coverage 100% for all nine functions. From the root:
    ./test/run-integration-tests.sh rc=0 (after the QA doc edits), TestPayloadRepair 0.08s,
    TestInsertMessage_Sanitized 0.01s, TestWriteRejection 0.07s, cmd/mqtt2bdd 83.397s. go.mod and
    go.sum unchanged. No control byte in the changed files; literal U+FFFD only in Markdown examples.
  qa_fuzz_2026_09_17: >-
    Differential fuzz on a throwaway copy inside go-dev (not committed), 120 s, 17,792,543
    executions, PASS. Properties: input not mutated; valid UTF-8 output; zero counts iff unchanged;
    idempotent; json.Valid preserved; for valid JSON, Go's decoder reads the same document before
    and after (NUL mapped to U+FFFD, U+FFFD runs collapsed).
  qa_encoding_probe_2026_09_17: >-
    PostgreSQL 15.17, throwaway LATIN1 database, PGCLIENTENCODING=UTF8: escaped é stored; escaped €
    and escaped U+FFFD refused with 22P05; raw € refused. Database dropped afterwards.

