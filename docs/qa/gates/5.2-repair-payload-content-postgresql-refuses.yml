schema: 1
story: '5.2'
story_title: 'Repair Payload Content PostgreSQL Refuses'
gate: PASS
status_reason: >-
  All eight ACs are met and independently re-verified: fmt, vet, staticcheck, unit and integration
  suites pass through the containers, sanitize.go has full coverage, and a 17.8-million-execution
  differential fuzz found no drift from Go's own JSON decoder. The one finding (DOC-009, an inaccurate
  reason for the UTF8 prerequisite) was corrected by QA in the README and architecture §3.
reviewer: 'Quinn (Test Architect)'
updated: '2026-09-17T00:00:00Z'

waiver: { active: false }

top_issues: []

resolved_issues:
  - id: 'DOC-009'
    severity: low
    finding: >-
      README.md ("What the binary still needs") and docs/architecture/error-handling-strategy.md §3
      said that under a non-UTF8 encoding PostgreSQL refuses every non-ASCII JSON escape. A probe on
      PostgreSQL 15.17 (LATIN1 database, UTF8 client) shows that an escaped character the encoding
      can represent is accepted, and that any character it cannot represent is refused with 22P05,
      escaped or raw, including the U+FFFD the repair writes. The conclusion (UTF8 is required) held;
      the reason was wrong and understated the impact.
    resolution: >-
      Both sentences rewritten from the probe: every unrepresentable character is refused, including
      U+FFFD, so repaired messages would be discarded too. The README sentence repeating its bold
      lead-in was removed. Both files re-scanned: no control byte.
    verified_by: 'Quinn (Test Architect), 2026-09-17'

risk_summary:
  totals: { critical: 0, high: 0, medium: 0, low: 1 }
  recommendations:
    must_fix: []
    monitor:
      - >-
        The repair's correctness depends on every backslash being an escape start, which holds for
        any payload that can be stored (C3). If a later story ever repairs content outside JSON
        strings or before a different parser, revisit this assumption.
      - >-
        C2: a repaired message that meets a database outage logs payload_sanitized on every retry.
        Documented and intended; expect bursts of WARN lines next to write_failure during an outage.

quality_score: 100
expires: '2026-10-01T00:00:00Z'

