e2e_validation:
  note: "Replayed independently rather than accepted from the Dev Agent Record. The image was rebuilt, run detached on mqtt2bdd-dev_mqtt2bdd-dev-network with --env-file dev/.env, driven with mosquitto_pub through the compose SERVICE name, and stopped with docker stop. Run detached rather than foreground deliberately: --rm would have destroyed the logs on exit, and the post-stop log stream is the evidence for AC13. Cleanup completed in full — see cleanup below."
  results:
    - "Startup (AC14): event=starting version=0.1.0 -> config_loaded (log_level=DEBUG effective_log_level=DEBUG buffer_size=1000) -> mqtt connecting/connected -> database connecting/connected -> pool_stats -> buffer_initialised -> writer_started -> health_monitor_started interval_s=60 -> subscribing/subscribed topic=# -> startup_complete version=0.1.0. buffer_size=1000 from config.LoadConfig's default confirms BUFFER_SIZE is correctly absent from dev/.env, as the PO's correction stated."
    - "Identity (AC10): docker exec mqtt2bdd-smoke id -> uid=65534(nobody) gid=65534(nobody) groups=65534(nobody). Cross-checked against .Config.User (nobody) and /proc/1/status (Uid: 65534)."
    - "PID 1 (AC13): /proc/1/exe -> /app/mqtt2bdd, /proc/1/cmdline = '/app/mqtt2bdd', Name: mqtt2bdd. The binary is PID 1 with no shell wrapper — structural proof of the exec form, independent of the shutdown behaviour."
    - "End-to-end write: mosquitto_pub -t 'qa/3.1/probe' -m '{\"temp\":21.5,\"probe\":\"qa-3.1\"}' produced message_received payload_size=30 then write_success duration_ms=26. The row genuinely reached PostgreSQL and was read back: qa/3.1/probe | 2026-07-25 18:40:10.976226 | {\"temp\": 21.5, \"probe\": \"qa-3.1\"}. Table count moved 112 -> 113. Payload kept valid JSON so insertWithRetry could not wedge."
    - "Graceful shutdown (AC13): docker stop -> shutdown_signal signal=terminated -> disconnected(mqtt) -> flush_complete count=0 -> pool_stats -> disconnected(database) -> shutdown_complete. Container exit code 0, wall time 0.216 s. Well inside Docker's 10 s grace on the happy path — see FIND-025 for the path where it would not be."
    - "SEC-001 on the log stream: dev/.env carries POSTGRES_PASSWORD=dev_password. Across the full DEBUG log stream, grep -c 'dev_password' -> 0 and grep -ci 'password|dsn|postgres://' -> 0."

security_probe:
  note: "SEC-001 is the standing constraint on this project and this is the first story to build an artefact that could carry a credential outside the log stream. It was probed adversarially rather than inferred from the .dockerignore contents, per the review standard. Six decoy files containing a fake POSTGRES_PASSWORD were planted, three builds were run, the context and both image stages were enumerated, and the decoys were then deleted (git status confirmed clean afterwards)."
  results:
    - "Root-level decoys EXCLUDED: .env (by pattern `.env`), .env.prod (by `.env.*`), production.env (by `*.env`). These are the two locations AC16 names — dev/.env is separately excluded by `dev/`."
    - "Nested decoys NOT excluded: internal/.env, cmd/secrets.env, internal/config/.env.prod all appeared in the context manifest and, via COPY cmd/ and COPY internal/, in /src of the builder stage. Root cause: .dockerignore patterns are anchored at the context root and `*` does not cross `/`, unlike .gitignore where a bare pattern matches at any depth. See FIND-022."
    - "RUNTIME IMAGE CLEAN even with all six decoys planted: `ls -la /app` returns only mqtt2bdd, and a find across the image for *.env, .env* and .git returns empty. The targeted COPY keeps the builder stage's contents out of the distributable artefact, and the builder stage is discarded. This is the check that matters for SEC-001 and it passes."
    - "No secret in build metadata: the only build arg is VERSION, which docker history exposes as `ARG VERSION=0.1.0` — not a credential. .Config.Env carries only the PATH inherited from the Alpine base; no ENV was added, so no default host, port or password is baked in."
    - "Build context measured at 57,806 bytes over 16 files, against a working tree carrying ~28.2 MB at the root (bin/mqtt2bdd 13.7 MB, __debug_bin262058197 14.5 MB, .git 16 MB, docs/ 992 kB)."

nfr_validation:
  security:
    status: PASS
    notes: "SEC-001 holds for the artefact this story creates, and it was probed rather than assumed — six planted decoys, three builds, both stages enumerated. The distributable runtime image contains /app/mqtt2bdd and nothing else: no env file, no .git, no source, no ENV default, no secret-bearing build arg. The log stream carries no credential at DEBUG against a real password value. USER nobody makes the image non-root BY DEFAULT rather than only when the deployer remembers a compose key, which is the substantive security gain of the AC10 ruling and is defence in depth ahead of Story 3.2's user: 65534:65534. The builder stage — which holds the toolchain and the full source — is discarded and never distributed. The one gap is latent rather than live and is recorded as low: the env globs are root-anchored (FIND-022), so a file placed under cmd/ or internal/ would reach the context and the builder, though never the shipped image. No such file exists, none is planned, and the failure mode is contained by the targeted COPY. Not raised to CONCERNS because nothing about the shipped artefact or the current tree is exposed."
  performance:
    status: PASS
    notes: "No run-time change — this story writes no Go code, and the observed write path (duration_ms=26) is unchanged from 2.6. The build-time posture is good and measured rather than asserted: -s -w are worth 4,294,122 bytes on a 20 MB budget (13,665,922 unstripped -> 9,371,800 stripped) and are present; --no-cache leaves /var/cache/apk at 0 bytes; the two-step COPY gives go mod download its own layer, demonstrated reused on the second build. Context transfer is 57.8 kB rather than ~28.2 MB, so an unrelated commit neither re-sends nor cache-busts. Headroom against AC11 is 7.2% decimal / 11.5% binary — comfortable but not generous, and worth restating for Story 3.2: a future package must be measured, not estimated. Startup to startup_complete took 6 ms in the container."
  reliability:
    status: PASS
    notes: "The image preserves the graceful shutdown that stories 2.4 and 2.6 built, which was the single largest risk in packaging this application, and it was verified in both directions rather than one: structurally (the binary is PID 1 with no shell interposed) and behaviourally (the full sequence, exit 0, in 0.216 s). The prohibitions are correct and were checked on the built image, not the source: no HEALTHCHECK — there is no probe to run in an image whose health signal is a log line, and a broken healthcheck is worse than none; no EXPOSE — the application serves nothing; no VOLUME — it keeps no state, which is also what makes read_only: true viable for Story 3.2. Configuration arrives entirely at run time. The one real reliability gap belongs to deployment rather than to this artefact and is correctly deferred: FIND-025's 10 s container grace against a 30 s drain bound, which no Dockerfile instruction can fix. Deferral sound; mechanism weak."
  maintainability:
    status: PASS
    notes: "The Dockerfile is 51 lines and every non-obvious one carries the reason it exists rather than a restatement of what it does — 'CGO_ENABLED=0 is what makes the binary static', 'ARG does not cross a FROM boundary', 'Exec form, so the binary is PID 1'. Those are exactly the three comments that stop a future maintainer deleting a load-bearing line, which is the standard coding-standards.md#comments-and-documentation sets, and it is a genuinely high bar met. The .dockerignore is grouped by intent with a rationale per group. English throughout both files. AC17 leaves the architecture describing the artefact that actually shipped, which is the discipline FIND-017 and FIND-020 exist to enforce, and it is the right call to have kept it here rather than routing it to 3.6. Two blemishes, both documentary and both low: the runtime stage carries no name (FIND-023), and one adjacent sentence in security.md still describes an image with no shell and no package manager (FIND-024)."

testability:
  controllability: "Good. VERSION is the single build-time input and is injectable per-build; everything else arrives from the environment at run time, so the image can be pointed at any broker or database without a rebuild. The story's --env-file dev/.env pattern exercises this and needs no file edit."
  observability: "Good, and the reason this review could be thorough. Every AC leaves a machine-readable trace off the built image — .Size, .Config.Labels, .Config.User, .Config.Entrypoint, docker history for the layer breakdown, go version -m for the build settings — so nothing had to be taken on trust. The application's own structured log stream supplies AC14 and AC13 directly."
  debuggability: "Adequate, with one caveat worth naming. The runtime image retains busybox, so `--entrypoint sh` gives a shell for post-mortem inspection — which this review used repeatedly and which a scratch or distroless base would have removed. The caveat is the flip side of FIND-024: that debuggability is real, and security.md tells the reader it does not exist. The anonymous runtime stage (FIND-023) also makes build output read `stage-1`, which is one small step less legible than it needs to be."

cleanup_verification:
  note: "Every artefact this review created was removed, and the environment was returned to its starting state. Confirmed by re-measurement, not by assertion."
