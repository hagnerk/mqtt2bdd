schema: 1
story: "3.1"
story_title: "Create Production Multi-Stage Dockerfile"
gate: PASS
status_reason: "All 17 ACs met and re-verified live rather than accepted from the Dev Agent Record: the image was rebuilt (reproducing the Dev's image ID b1ec308a5085 byte for byte), measured at 18,554,844 bytes, dissected by layer, probed adversarially with six planted credential decoys, run against the dev stack through a real MQTT write to PostgreSQL, and stopped with docker stop for the full graceful sequence at exit 0. SEC-001 holds for the distributable artefact. Toolchain and tests clean. Four low-severity follow-ups, none blocking."
reviewer: "Quinn (Test Architect)"
updated: "2026-07-25T00:00:00Z"

waiver: { active: false }

top_issues:
  - id: "FIND-022"
    severity: low
    finding: "The .dockerignore environment-file globs are root-anchored, but their own comment claims they catch env files 'wherever they sit'. Proven by planting six decoys and enumerating the resulting build context: the three root-level ones (.env, .env.prod, production.env) are genuinely excluded, while internal/.env, cmd/secrets.env and internal/config/.env.prod all entered the context AND the builder stage — because .dockerignore matches a bare pattern only at the context root, whereas .gitignore matches it at any depth. The two files look alike and do not behave alike, which is exactly how this gets copied wrong. AC16 is nonetheless MET: its wording names dev/.env (excluded by `dev/`) and a root-level .env / .env.prod (excluded by the globs), and both are covered. The exposure is latent, not live — no env file exists or is planned under cmd/ or internal/, and even with all six planted the runtime image contained /app/mqtt2bdd and nothing else, since the builder stage is discarded and the COPY is targeted. Suggested: make the globs recursive (**/.env, **/.env.*, **/*.env), or correct the comment so the next reader does not trust a reach the patterns do not have. Nice-to-have alongside it: .gitignore carries .idea/ and *.pid, .dockerignore does not."
    suggested_owner: dev
    suggested_story: "3.2"
    refs: [".dockerignore:10-16"]
  - id: "FIND-023"
    severity: low
    finding: "AC1 requires 'two stages: `builder` and `runtime`'. Only the first is named: line 4 is `FROM golang:1.23-alpine AS builder`, line 28 is a bare `FROM alpine:3.23`. Consequences are small but real and were verified rather than assumed — `docker build --target runtime .` fails with 'target stage \"runtime\" could not be found', and BuildKit labels every runtime step `[stage-1 n/3]` in build output, which is less legible than it needs to be for a story whose deliverable is read by operators. AC1 is met in substance (two stages exist; the one that COPY --from addresses is named exactly as required), so this is AC fidelity rather than a defect. Ownership is shared and none of it is the Dev agent's: the PO-validated reference shape in Dev Notes → The Dockerfile also omits `AS runtime`, and the Dev implemented that shape faithfully. Suggested: append `AS runtime` to line 28 — a one-word change that makes the file match its own AC."
    suggested_owner: dev
    suggested_story: "3.2"
    refs: ["Dockerfile:28", "docs/stories/3.1.story.md:371"]
  - id: "FIND-024"
    severity: low
    finding: "AC17's stated purpose is that 'the architecture and the Dockerfile stop contradicting each other'. Item 2 of security.md#container-security still contradicts it, in the very sentence the story edited. It reads: 'The runtime stage uses `alpine:3.23` (~5 MB) ... The final image contains only the statically-linked binary and Alpine's minimal userland — no shell tools, no package manager, no Go toolchain.' Measured against the shipped image: the base is 8,657,696 bytes, not ~5 MB; busybox 1.37.0 is present with 304 applets including /bin/sh (this review used it repeatedly); and apk-tools 3.0.6 is present at /sbin/apk — the Dockerfile's own `RUN apk add` proves the package manager exists in the runtime base. Only 'no Go toolchain' is true. The Dev agent is not at fault: Task 4 enumerated exactly one change in that item (alpine:3.21 -> alpine:3.23) and the scope guard forbade widening, so following instructions produced this. It is worth raising because Story 3.2 reads this section for read_only: and tmpfs: and will be reasoning about an image it is told has no shell. Suggested: correct the size figure and the 'no shell tools, no package manager' clause in whichever story next opens this shard."
    suggested_owner: sm
    suggested_story: "3.2"
    refs: ["docs/architecture/security.md:151"]
  - id: "FIND-025"
    severity: low
    finding: "Docker's default stop grace is 10 s; defaultShutdownTimeout in main.go is 30 s. The deferral to docker-compose.prod.yml in Story 3.2 is assessed as SOUND on its merits, not merely convenient: there is no Dockerfile instruction that can set a stop grace period — STOPSIGNAL sets the signal, not the timeout — so the fix can only live in `stop_grace_period:` (compose) or `--stop-timeout` (docker run). Story 3.1 cannot fix this in its own artefact, and correctly does not create docker-compose.prod.yml. The gap has genuine teeth in exactly the scenario the 30 s bound exists for: with a non-empty buffer and a database outage, insertWithRetry retries every 10 s indefinitely, so the drain can run the full 30 s, at which point a plain `docker stop` has already SIGKILLed the process at t+10 s — losing buffered messages, yielding exit 137, and emitting neither flush_timeout nor shutdown_complete. Not exercised in the happy path: this review measured shutdown at 0.216 s with exit 0. What is weak is the deferral MECHANISM, not the decision — it currently exists only as prose inside a story about to close, which is precisely the failure mode FIND-017 was raised for on this project. Suggested: register it as an explicit AC on Story 3.2 rather than a note."
    suggested_owner: sm
    suggested_story: "3.2"
    refs: ["cmd/mqtt2bdd/main.go:25", "cmd/mqtt2bdd/main.go:264-276", "docs/stories/3.1.story.md:127"]

