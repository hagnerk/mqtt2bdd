waiver: { active: false }

top_issues:
  - id: "REL-001"
    severity: low
    finding: "healthCheckLoop reports mqtt_status=connected based solely on mqttClient.IsConnected(), which cannot distinguish 'properly subscribed' from 'connected but permanently unsubscribed' if a resubscribe were ever to fail permanently rather than transiently. AC12's retry-forever fix correctly handles the transient case (a broker restart) that is the only failure mode this project can currently reproduce (no broker ACLs; broker authentication is a separately deferred item). Flagged explicitly by the PO at validation (Ruling 1) as a real, unresolved design question, deliberately not folded into an AC to avoid rewriting a six-gate-old ruling. Not live today — no mechanism in this project makes a Subscribe call permanently and deterministically fail."
    suggested_action: "If the project ever gains ACL-capable broker authentication, revisit whether a permanently-failing re-subscribe should demote mqtt_status away from connected in healthCheckLoop. No action needed today."
    suggested_owner: sm
  - id: "TEST-001"
    severity: low
    finding: "AC9's negative path (test/run-integration-tests.sh exiting non-zero on a deliberately broken scenario) was verified by the Dev Agent Record's account (POSTGRES_DB pointed at a nonexistent database, script correctly failed the smoke-test assertion and exited 1) but was not independently re-exercised in this review. The happy path was independently re-run twice, both exit 0."
    suggested_action: "No action required — accepted on the Dev's documented account, consistent with the review standard applied to Story 3.2's AC9-equivalent checks. Worth a first-hand re-check only if this script is next touched for an unrelated reason."
    suggested_owner: dev

resolved_issues:
  - id: "FIND-010"
    severity: high
    finding: "internal/mqtt/client.go's reconnectLoop attempted Subscribe exactly once after a successful reconnect and returned regardless of outcome, leaving IsConnected()==true with no live subscription — the pipeline went silently deaf while health_check kept reporting mqtt_status=connected. First raised gate 2.2, carried through six subsequent gate closures, homed on this story (AC12) by gate 3.2's carry-forward register."
    resolution: "reconnectLoop now retries Subscribe every defaultMQTTReconnectInterval until it succeeds or c.shutdown closes, firing resubscribe_failed on every failed attempt (not just the first). Proven two ways, both re-run live in this review: internal/mqtt/client_test.go's fake-Paho-client unit tests (TestReconnectLoop_RetriesResubscribeUntilSuccess, TestReconnectLoop_ResubscribeStopsOnShutdown, ~0.03s total), and cmd/mqtt2bdd/mqtt_reconnect_integration_test.go's TestMQTTReconnect, which genuinely stops and restarts mqtt2bdd-test-mosquitto (not a mock) and confirms a message published after the restart is received and persisted. PASS twice in this review (10.46s, 10.68s)."
    refs: ["internal/mqtt/client.go:170-189", "internal/mqtt/client_test.go", "cmd/mqtt2bdd/mqtt_reconnect_integration_test.go"]
  - id: "FIND-016"
    severity: medium
    finding: "cmd/mqtt2bdd/main.go's shutdown drain path used context.Background() and a bare time.Sleep, so a database outage during shutdown could run the drain past defaultShutdownTimeout while dbClient.Close() tore down the pool underneath it. First raised gate 2.4, homed on this story (AC13) by gate 3.2's carry-forward register."
    resolution: "A shutdownCtx is created cheaply via context.WithCancel at startup and armed via time.AfterFunc(defaultShutdownTimeout, shutdownCancel) at the exact moment close(done) fires, so it shares the same 30s budget main's own select already races from the same starting instant. insertWithRetry now takes a ctx (steady state passes context.Background(), unbounded, unchanged invariant from 1.8/2.3; the drain branch passes shutdownCtx). Proven by cmd/mqtt2bdd/shutdown_integration_test.go's TestShutdownDrainBounded against a genuinely stopped test-postgres, re-run live twice in this review (36.59s, 36.55s): process exits within the bound, flush_timeout -> shutdown_complete, exit 0."
    refs: ["cmd/mqtt2bdd/main.go:20-95,226-303", "cmd/mqtt2bdd/shutdown_integration_test.go"]
  - id: "message_dropped-healthWG-test-debt"
    severity: low
    finding: "The message_dropped WARN (main.go's producer-blocked-at-shutdown branch) and healthWG.Wait()'s teardown-ordering placement had zero automated coverage; both relied on manual E2E or code inspection. Deferred verbatim from gate 2.5, restated in gates 2.6, 3.1, 3.2."
    resolution: "New TestGracefulShutdown (cmd/mqtt2bdd/shutdown_integration_test.go) stops test-postgres before a fast burst against BUFFER_SIZE=2, deterministically filling the buffer and catching a producer mid-send at SIGTERM; asserts message_dropped fires with the correct topic=, and that no health_check line's timestamp is later than shutdown_complete's. Re-run live twice in this review (35.91s, 35.96s), both PASS, exit 0, message_dropped topic matched the published topic both times, zero health_check lines observed (expected given the 60s interval vastly exceeds the ~36s test runtime)."
    refs: ["cmd/mqtt2bdd/main.go:255-269,308", "cmd/mqtt2bdd/shutdown_integration_test.go"]

