nfr_validation:
  security:
    status: PASS
    notes: "No new exposure. test/mosquitto/mosquitto.conf carries the same allow_anonymous true posture already accepted for dev/ (unchanged, not new). test_password is a throwaway credential for a disposable, tmpfs-backed, host-only stack, matching the dev/prod convention. The Docker-socket mount into the throwaway test-runner container is narrowly scoped to the test harness itself (needed for the AC12/AC13 tests' own docker stop/start calls) and grants no new capability to the shipped mqtt2bdd application or image. Broker-authentication deferral remains correctly out of scope, per Story 3.2's gate."
  performance:
    status: PASS
    notes: "No run-time regression: the new context.WithTimeout wrapping each insert attempt is inert during normal operation and only becomes observable on the drain path it exists to bound. Health-check intervals (5s/10s) are appropriately faster than prod's, matching the stack's disposable nature. Dockerfile-reuse decision is backed by measured build times (8.8s/9.2s), not estimated, and both of this review's full runs completed in a few minutes end to end."
  reliability:
    status: PASS
    notes: "FIND-010 and FIND-016, two real production bugs each carried across six prior gate closures, are now fixed and proven against real broker/database outages rather than mocks -- re-verified live, twice, in this review. TestGracefulShutdown closes the last piece of test debt (message_dropped/healthWG ordering) deferred since gate 2.5. The one open design question (REL-001) is a genuine gap but not live today and is correctly not blocking."
  maintainability:
    status: PASS
    notes: "Test helpers are well-factored (integration_helpers_test.go), commented where non-obvious, and match the story's own Dev Notes reference content verbatim by diff. The architecture reconciliation (AC15) keeps the sharded docs describing the artefact that actually shipped, following the same facts-only discipline Stories 3.1/3.2 established. The carry-forward register is accurate and none of Stories 3.4/3.6's homed findings were pulled into this diff (confirmed via git show --stat: no logging-standards.md, no components.md change)."

testability:
  controllability: "Good. The test stack is fully parameterised (host ports, credentials) and its ephemeral tmpfs storage guarantees a clean slate every run regardless of how the previous run ended. Real broker/database restarts are driven programmatically from inside the Go test binary via the mounted Docker socket, giving deterministic control over the exact failure conditions AC12/AC13 need."
  observability: "Good. Every AC leaves a machine-readable trace: structured stdout log lines from the subprocess under test (scanned and asserted on directly), docker compose ps health status, and direct SQL queries against sensor_metrics for row-level verification. Nothing in this review had to be taken on trust."
  debuggability: "Adequate. Subprocess stdout is captured to both an in-memory buffer (for assertions) and os.Stderr (for a human reading test output), and t.Cleanup ensures a leftover subprocess is killed even on a failed assertion. The throwaway golang:1.23-alpine test-runner container retains a full shell and toolchain, unlike the runtime image, so a failed run can be investigated interactively if needed."

