top_issues:
  - id: "FIND-020"
    severity: low
    finding: "docs/architecture/logging-standards.md is exact where AC12 scopes it — the `component`, `event` and `operation` tables match the code key for key (37 event values across three components, 7 operation values, verified by grep) — but its auxiliary Domain Fields table is not exhaustive. Eleven attribute keys the code emits today have no row: `attempt` (mqtt reconnecting / reconnect_failed), `level` (unknown_log_level), `original_length` and `truncated_topic` (topic_truncated), `timestamp` and `query` (write_success / write_duplicate), `payload` (message_received at DEBUG), and the four pool_stats counters (`acquired_conns`, `idle_conns`, `total_conns`, `max_conns`). Separately, `buffer_size` — emitted on `buffer_full`, a buffer-pressure event — is filed under 'Startup / shutdown'. This is inherited from story 2.5's table rather than introduced here, and none of it weakens the contract AC12 asks for; the risk is that the next reader treats the table as closed and invents a synonym for a field that already exists. Suggested: complete the table in the next story that touches a log line, or state explicitly that it enumerates only the fields the epic's ACs name."
    suggested_owner: dev
    refs: ["docs/architecture/logging-standards.md:68-83", "internal/mqtt/client.go:156", "internal/database/queries.go:19-23", "internal/database/client.go:139-147"]
  - id: "FIND-021"
    severity: low
    finding: "The two pure computations inside healthCheckLoop are unreachable from a test. The story deliberately excluded a timing test of the ticker, which is right — but the `processed := total - lastWriteCount` delta and the `-1` age sentinel are arithmetic, not timing, and they are the parts of AC4/AC7 that a regression would silently break. Both are currently proven only by manual replay (done, and reproduced by this review). Extracting a `writeAgeSeconds(lastWrite, now time.Time) int64` helper alongside the existing `connectionStatus` / `bufferUtilizationPercent` pair would make the sentinel branch table-testable at zero design cost and without making the interval injectable. The delta is harder to isolate without a seam, and is lower value — unsigned subtraction against a monotonic counter is correct by construction."
    suggested_owner: dev
    refs: ["cmd/mqtt2bdd/main.go:119-129", "cmd/mqtt2bdd/main_test.go"]

