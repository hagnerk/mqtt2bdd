    ac_gaps: []
  ac_notes:
    - ac: 1
      note: "health_monitor_started … interval_s=60 observed in the startup sequence between writer_started and subscribing, in all three QA runs. The goroutine is launched after the DB writer and before Subscribe, on its own healthWG, exactly as Task 4 prescribes."
    - ac: 2
      note: "Every field of the AC's enumerated set present on every observed entry, carrying component=main by inheritance: mqtt_status, db_status, db_last_write_age_s, buffer_used, buffer_capacity, buffer_utilization_percent, processed_last_interval. The documented deviation (structured attributes rather than an interpolated sentence) is implemented as specified and, per the story's instruction and the PO's PRD amendment, is not raised as a defect."
    - ac: 3
      note: "mqttClient.IsConnected() is called directly on the tick (main.go:133). Not exercised against a stopped broker by this review — the dev's replay covers it and the call is a one-liner against an already-shipped method. Noted for the record: FIND-010's interaction (a failed re-subscription leaves IsConnected() true while nothing is received) is a faithful report of the connection, as the story states, not a defect here."
    - ac: 4
      note: "Both directions reproduced independently. With postgres stopped and one message published, the write failed (write_failure every 10 s via insertWithRetry) and the next tick reported db_status=disconnected db_last_write_age_s=-1. After restarting postgres the retried write succeeded and the following tick reported db_status=connected db_last_write_age_s=48 processed_last_interval=1. The seeding path is equally confirmed: a fresh run reports db_status=connected on its first tick, from the startup Ping alone, with db_last_write_age_s=-1. No Ping method was added — grep-verified — and IsConnected() performs no network call."
    - ac: 5
      note: "bufferUtilizationPercent is unit-tested including the capacity==0 guard (0, not NaN) and the exact-80 / 80.1 boundary pair. Live entries reported buffer_used=0 buffer_capacity=1000 buffer_utilization_percent=0 against the default buffer."
    - ac: 6
      note: "Threshold is strictly greater than bufferHighWaterMarkPercent, and the WARN is a separate entry with its own event=buffer_high, as required. The rounding cannot manufacture a false WARN: a rounded value above 80 requires 80.05 actual, so the error direction is conservative. Emission itself verified by the dev's BUFFER_SIZE=5 replay, not re-run here."
    - ac: 7
      note: "processed_last_interval=2 on the tick following two published messages, then 0 on the next — reproduced by this review. WriteCount is monotonic and the delta is computed per tick, so a duplicate write counts once, as the story requires."
    - ac: 8
      note: "time.NewTicker with defer Stop, select on ticker.C and done. Measured across three runs: ticks 60.002 s, 60.001 s, 60.005 s and 59.993 s apart — under 7 ms of drift, with no accumulation. The done branch returns; healthWG.Wait() is placed after the drain select and before dbClient.Close(), so no goroutine reads the client while its pool is torn down."
    - ac: 9
      note: "The dev's five-minute observation is corroborated rather than merely accepted: this review ran the app three more times and observed six further health_check entries at the correct cadence with accurate status in every field."
    - ac: 10
      note: "Re-run by QA in the go-dev container: gofmt -l . silent, go vet, staticcheck and go build clean, go test ./... all pass."
    - ac: 11
