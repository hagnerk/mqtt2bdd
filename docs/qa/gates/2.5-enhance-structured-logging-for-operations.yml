story: "2.5"
story_title: "Enhance Structured Logging for Operations"
gate: PASS
status_reason: "All 12 ACs met and independently verified by live E2E replay, not merely by the Dev Agent Record. Every log call site in the tree emits through a component-tagged logger exactly once, three previously silent failure paths now log before exiting 1, and SEC-001 holds even in the pgx error path. Toolchain and tests clean. Three low-severity follow-ups, none blocking."
reviewer: "Quinn (Test Architect)"
updated: "2026-07-25T00:00:00Z"

waiver: { active: false }

top_issues:
  - id: "FIND-017"
    severity: low
    finding: "The Log Field Vocabulary — the authoritative contract for `component`/`event`/`operation` across the whole application — lives only in the Dev Notes of story 2.5, which is about to be closed. It is already stale: implementation added four event values (`connect_failed`, `subscribe_failed`, `resubscribe_failed`, `reconnect_failed`) that the table does not list. The dev agent flagged the extension honestly and the values are consistent with the table's own modelling of failure as a distinct event (`write_failure`), so this is drift in the document, not in the code. The risk is forward-looking: the next story touching a log line has no durable reference and will re-derive or contradict the vocabulary. Suggested: extract the table to docs/architecture/ (alongside error-handling-strategy.md) with the four new values folded in, and have the story reference it rather than restate it."
    suggested_owner: sm
    refs: ["docs/stories/2.5.story.md:164-195", "docs/architecture/error-handling-strategy.md"]
  - id: "FIND-018"
    severity: low
    finding: "The `config_loaded` line reports the *requested* log level, not the *effective* one. Verified live: with LOG_LEVEL=VERBOSE the entry reads `event=config_loaded log_level=VERBOSE` while the handler is actually running at INFO. An operator reading the stream in order is not misled — the `unknown_log_level` WARN is emitted immediately above it — but anyone grepping `event=config_loaded` in isolation, or reading a log shipped without WARN, concludes DEBUG-adjacent verbosity is active when it is not. Suggested: have the logger package expose the level it resolved to and log that, or add an `effective_log_level` attribute alongside the requested one."
    suggested_owner: dev
    refs: ["cmd/mqtt2bdd/main.go:84", "internal/logger/logger.go:27-43"]
  - id: "FIND-019"
    severity: low
    finding: "AC4's `duration_ms` uses elapsed.Milliseconds(), which truncates toward zero, so every sub-millisecond write reports `duration_ms=0`. Not currently degenerate — measured writes against the containerised Postgres came in at 8-27 ms — but a warm pool on production-grade hardware routinely completes an INSERT in well under a millisecond, and the field then reads 0 for exactly the healthy fast path it exists to measure, leaving no way to distinguish 'fast' from 'not measured'. This follows the pattern prescribed in error-handling-strategy.md#logging-standards-for-errors and was mandated verbatim by the story, so it is an architecture-level choice rather than an implementation defect. Suggested: switch the architecture pattern to a float millisecond (elapsed.Seconds()*1000) or log duration_us, and apply it consistently wherever timing is added."
    suggested_owner: po
    refs: ["internal/database/queries.go:31", "internal/database/queries.go:38", "internal/database/queries.go:50", "internal/database/queries.go:58", "docs/architecture/error-handling-strategy.md#logging-standards-for-errors"]

resolved_issues:
  - id: "FIND-015"
    severity: low
    resolution: "Fixed in commit f9d8a34. The producer's full-buffer fallback now logs `l.Warn(\"message dropped at shutdown, buffer was full\", \"event\", \"message_dropped\", \"topic\", topic)` in the `case <-done:` branch (cmd/mqtt2bdd/main.go:136-138), adopting the gate's suggested fix and adding the `event` key for grep parity with the rest of the vocabulary. Shutdown-time data loss is now observable. The surrounding shutdown logic is untouched — verified by inspection of the diff: close(done) at main.go:158, the drain loop in dbWriterLoop, and the msgChan-never-closed invariant from FIND-014 all remain exactly as story 2.4 left them."
    verified_by: "Quinn (Test Architect), 2026-07-25"

