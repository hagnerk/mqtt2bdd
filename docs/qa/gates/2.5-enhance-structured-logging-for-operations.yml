    - ac: 8
      note: "The only AC with genuine automated coverage. TestNewLogger_TimestampIsUTC asserts the Z suffix and RFC 3339 parse across all four levels, against a bytes.Buffer — a real regression net, not a smoke test. The ReplaceAttr guard (a.Key == slog.TimeKey && len(groups) == 0) correctly spares nested caller attributes named 'time'."
    - ac: 9
      note: "Payload-truncation deviation respected exactly. Confirmed by grep that no TruncatePayload helper and no maxDebugPayloadLen constant exist anywhere in the tree, and by live replay that a 411-byte JSON payload was emitted whole with no ellipsis or truncation marker. Per the story's explicit instruction, this deviation from the epic's wording is NOT raised as a defect. The PRD's AC9 still needs amending to match — PO action, tracked below."
    - ac: 10
      note: "Satisfied as structured-field review over TextHandler output, per the documented deviation. Switching to JSONHandler would contradict three architecture documents; the handler correctly stays slog.NewTextHandler. Flagged again for PO awareness: if genuine JSON output is wanted, it is an architecture change warranting its own story."
    - ac: 12
      note: "Implemented and correct by inspection, but not exercised by any test or by the manual E2E — firing it requires a full buffer racing shutdown. Counted as covered rather than a gap because the change is a single log line in a branch that story 2.4 already validated; automated proof is deferred to Story 3.3's TestGracefulShutdown."

toolchain_validation:
  environment: "mqtt2bdd-dev-go-dev container, via docker compose exec from dev/ (2026-07-25)"
  results:
    - "gofmt -l . -> clean, no output"
    - "go vet ./... -> no warnings"
    - "staticcheck ./... -> no warnings"
    - "go build ./... -> clean"
    - "go test -count=1 ./... -> all pass (internal/config, internal/logger; no test files in cmd/mqtt2bdd, internal/database, internal/mqtt)"
    - "go build -ldflags=\"-X main.Version=0.2.5-qa\" -> binary logs version=0.2.5-qa on both the starting and startup_complete lines (AC7 reproduced independently)"

e2e_validation:
  note: "Replayed independently rather than accepted from the Dev Agent Record. A separate binary was run inside go-dev, driven with mosquitto_pub, and terminated with a PID-targeted SIGTERM; all four QA-inserted rows were deleted from sensor_metrics afterwards (112 pre-existing rows untouched)."
  results:
    - "Happy path at LOG_LEVEL=DEBUG: full startup sequence observed in order — starting -> config_loaded -> mqtt connecting/connected -> database connecting/connected -> pool_stats -> buffer_initialised -> writer_started -> subscribing/subscribed -> startup_complete (AC6)."
    - "Every one of the 22 emitted lines carried time= (RFC 3339, Z suffix), level=, msg= and exactly one component= (AC1, AC8, AC10). The duplicate-component defect the dev agent self-corrected is confirmed absent."
    - "mqtt entries inherit broker=tcp://...:1883; database entries inherit host= and database=. No call site repeats them (AC2, AC3)."
    - "write_success carried topic, payload_size, duration_ms and the SQL query at DEBUG (AC4, AC9)."
    - "MQTT connect timeout (MQTT_BROKER=192.0.2.1): emits connect_timeout/operation=connect/error=\"context deadline exceeded\", then startup_aborted with failed_component=mqtt, exit 1. This path logged nothing at all before this story — the story's central reliability claim, reproduced (AC5, AC6)."
    - "Database unreachable (POSTGRES_HOST=192.0.2.1): connect_failed/operation=ping then startup_aborted with failed_component=database, exit 1 (AC5)."
    - "Config failure (MQTT_BROKER unset): config_load_failed/operation=load_config emitted through the bootstrap logger, component=main, exit 1 — the path that used to be an unstructured log.Fatalf (AC5)."
    - "Unknown level (LOG_LEVEL=VERBOSE): unknown_log_level WARN carries component=main, closing the one line that previously escaped AC1 (AC1). See FIND-018 for the config_loaded consequence."
    - "Long topic (403 chars): topic_truncated WARN with original_length=403 and the renamed truncated_topic key; the subsequent write logged under topic= (AC1, AC4)."

nfr_validation:
  security:
    status: PASS
    notes: "SEC-001 upheld and actively probed, not assumed. config_loaded carries only log_level and buffer_size. The dsn field is never passed to a log call (grep-verified). brokerURL is built from MQTTBroker/MQTTPort only, so credentials cannot reach the mqtt logger's inherited attributes even though NewClient holds cfg. The new failure paths were the real risk — they log pgx errors verbatim — so they were tested directly with POSTGRES_PASSWORD='SuperSecretPassw0rd' and a malformed DSN: the password appears zero times in the output (pgx redacts it; the error surfaces user= and dbname= only). The full-payload DEBUG logging is sensor telemetry on a home-automation broker, already accepted in story 1.6, and no authentication material transits the message path."
  performance:
    status: PASS
    notes: "The hot-path guard is present and correct: c.logger.Enabled(context.Background(), slog.LevelDebug) wraps the per-message DEBUG call, so string(msg.Payload()) — which slog would otherwise evaluate before the level check — never allocates at INFO. This matters more, not less, now that payloads are uncapped. The duration_ms timing needs no guard; time.Now()/time.Since are negligible against a database round-trip. Accepted consequence, restated for the record: at DEBUG, log volume now scales with payload size rather than being capped per message."
  reliability:
    status: PASS
    notes: "Net improvement to operability with no change to control flow. Three failure paths that previously exited 1 in silence or near-silence now emit a structured ERROR first — all three reproduced live. The MQTT context-cancelled branch passes ctx.Err() rather than a fixed string, keeping a future non-deadline cancellation distinguishable. Out-of-scope boundaries were respected exactly: FIND-016 untouched, FIND-010's log line enriched without adding the retry loop, dbWriterLoop and insertWithRetry still free of logging and of a *slog.Logger parameter per story 2.3.1, and the msgChan-never-closed invariant from FIND-014 intact."
  maintainability:
    status: PASS
    notes: "This is the strongest part of the story. Component names are exported constants and WithComponent is the single choke point for attaching them, so the value cannot drift. Binding component/broker/host/database once at construction and deleting the eight per-call duplicates removes a whole class of copy-paste inconsistency — and the slog double-emit bug that came with it. Comments explain why (the level guard, the string() conversion, failed_component vs component, the untagged baseLogger) rather than what. Godoc on every new exported symbol, three-block imports, receiver c, no magic numbers. The one blemish is documentary, not structural: see FIND-017."

