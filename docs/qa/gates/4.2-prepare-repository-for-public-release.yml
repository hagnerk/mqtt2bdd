top_issues:
  - id: 'TEST-002'
    severity: low
    finding: >-
      AC4's audit command 2 (`grep -c "BEGIN .*PRIVATE KEY"` over every blob) is self-referential.
      It returned 0 on 2026-07-29 because it ran before commit 32410e2, which committed the story
      and gate quoting the command's own pattern. Re-run on the published history it returns 9: 9
      lines in 3 blobs (two versions of docs/stories/4.2.story.md and gate 4.2), every one a
      quotation of the command or of its result, none a key. AC4 requires the audit to be
      reproducible; the command is reproducible, but its recorded expected result is not.
    suggested_action: >-
      For any future re-run of this audit, anchor on the PEM armour line instead:
      `grep -c -E -- "-----BEGIN [A-Z ]*PRIVATE KEY-----"`, which returns 0 on the published history
      and cannot match prose quoting it. No change to story 4.2 is needed; its record is historical.
    suggested_owner: dev
    refs: ['docs/stories/4.2.story.md#task-4--the-history-audit-re-run-in-full-ac4']

