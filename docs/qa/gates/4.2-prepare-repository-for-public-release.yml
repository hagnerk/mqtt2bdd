schema: 1
story: '4.2'
story_title: 'Prepare the Repository for Public Release'
gate: CONCERNS
status_reason: >-
  The seven ACs this story could deliver (1, 2, 3, 4, 5, 9, 11) are all met, independently
  re-verified, and defect-free. LICENSE was diffed programmatically against the canonical MIT text
  and is byte-identical, which is what earns the repository a real MIT chip rather than "Other". The
  history audit was re-run in full and all 17 credential-shaped matches confirmed as development
  fixtures. DOC-001 is genuinely closed after three deferrals. The gate is CONCERNS, not PASS, for
  one reason only: ACs 6, 7, 8 and 10 are not met, because publishing a public repository is
  irreversible and is the maintainer's decision, which the maintainer deferred. The story handles
  that honestly — it states the gap in four places, delivers every precondition, and carries a
  verified runnable handover — but an unmet AC is an unmet AC and this gate will not record it as
  anything else. Nothing here blocks Stories 4.3 or 4.4.
reviewer: 'Quinn (Test Architect)'
updated: '2026-07-29T00:00:00Z'

waiver: { active: false }

top_issues:
  - id: 'PUB-001'
    severity: medium
    finding: >-
      ACs 6, 7, 8 and 10 are not met. The GitHub repository github.com/hagnerk/mqtt2bdd does not
      exist (confirmed independently: `gh repo view hagnerk/mqtt2bdd` returns "Could not resolve to a
      Repository"), `git remote -v` is empty, and no history has been pushed. AC10's
      GitHub-rendering verification is unreachable in consequence. This is a deliberate, disclosed
      deferral of an irreversible owner decision, not a defect in the work delivered, and it is not
      raised as a defect — but it is tracked as open so it cannot be lost.
    suggested_owner: maintainer
    refs: ['docs/stories/4.2.story.md#acs-6-7-8-and-10-not-done-handed-over']

