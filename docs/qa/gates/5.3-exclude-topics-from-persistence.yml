schema: 1
story: '5.3'
story_title: 'Exclude Topics from Persistence'
gate: PASS
status_reason: >-
  All ten ACs are met and independently re-verified: gofmt, vet and staticcheck are clean with and
  without -tags=integration, the unit and integration suites pass through the containers (rc=0),
  parseTopicFilters, validateTopicFilter and MatchTopic each have 100 % statement coverage, and a
  throwaway probe confirms MatchTopic allocates nothing and never panics on an invalid filter. The
  one finding (DOC-010, a grammatical slip in the new README bullet) was corrected by QA.
reviewer: 'Quinn (Test Architect)'
updated: '2026-09-18T00:00:00Z'

waiver: { active: false }

top_issues: []

resolved_issues:
  - id: 'DOC-010'
    severity: low
    finding: >-
      The new README "Features" bullet read "excluded messages are still delivered by the broker and
      crossing the network", mixing a passive and a participle so the sentence does not parse. The
      README is the portfolio-facing entry point of a public repository.
    resolution: >-
      Rewritten as "are still delivered by the broker and still cross the network". No other change
      to the bullet, and no reflow of the surrounding paragraph.
    verified_by: 'Quinn (Test Architect), 2026-09-18'

risk_summary:
  totals: { critical: 0, high: 0, medium: 0, low: 1 }
  recommendations:
    must_fix: []
    monitor:
      - >-
        The comma is the configuration separator, so a topic filter containing a comma cannot be
        expressed through MQTT_EXCLUDE_TOPICS. MQTT 3.1.1 §4.7.3 allows one; no broker in this
        project's scope publishes such a topic. Revisit only if an operator reports it.
      - >-
        C5: at LOG_LEVEL=DEBUG an excluded message still produces a message_received line carrying
        the full payload body, from internal/mqtt, before message_excluded. Excluding a large,
        chatty topic therefore does not make DEBUG quieter. Documented in the README Troubleshooting
        entry; expect the question from operators who exclude zigbee2mqtt/bridge/# for that reason.
      - >-
        internal/config/topics.go and internal/mqtt/topic.go each declare their own "/", "#" and "+"
        constants. Deliberate (config cannot import mqtt without a cycle, C1) and documented, but the
        §4.7 grammar now lives in two files: change one, check the other.

quality_score: 100
expires: '2026-10-02T00:00:00Z'

