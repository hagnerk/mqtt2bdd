nfr_validation:
  security:
    status: PASS
    notes: >-
      The payload body is never logged on message_excluded (asserted line by line by the integration
      test, and structurally true since the handler returns before the Message is built). The
      config_load_failed error names only the filter, which is operator-supplied configuration, not
      a secret. No new dependency, no new network or filesystem surface.
  performance:
    status: PASS
    notes: >-
      MatchTopic walks both strings with strings.Cut and allocates nothing (QA-verified, 0 allocs).
      With ExcludeTopics nil — the v1.0.0 path — excludingFilter's loop body never runs, so the
      default costs one nil slice range per message. Validation runs once at startup and may split.
  reliability:
    status: PASS
    notes: >-
      An invalid filter aborts startup with a named cause rather than silently excluding nothing.
      The check is the handler's first statement, so an excluded message can never be timestamped,
      wait on a full buffer, or be reported as buffer_full or message_dropped. processed_last_interval
      stays the WriteCount delta and is untouched by construction. No schema change; git revert of
      this story alone restores v1.0.0 behaviour.
  maintainability:
    status: PASS
    notes: >-
      Two small pure functions, named constants, why-comments citing §4.7, godoc on the one exported
      function stating its precondition and its allocation contract. Tests are table-driven with row
      names that say what each row proves. components.md, logging-standards.md and core-workflows.md
      are reconciled with the code, and the three configuration templates agree with the README table.

