schema: 1
story: '5.1'
story_title: 'Stop Retrying Writes the Database Can Never Accept'
gate: PASS
status_reason: >-
  All twelve ACs are met and independently re-verified: fmt, vet, staticcheck, unit and integration
  suites pass through the containers, and TestWriteRejection shows a valid message stored in 0.07 s
  behind two rejected ones and an empty one. The primary risk (a transient error classified as
  permanent) is pinned by table and integration tests. The two documentation-drift items found in
  review (DOC-006, DOC-007) were fixed; one low item remains on the story file itself (DOC-008).
reviewer: 'Quinn (Test Architect)'
updated: '2026-09-17T00:00:00Z'

waiver: { active: false }

top_issues:
  - id: 'DOC-008'
    severity: low
    finding: >-
      docs/stories/5.1.story.md contains three raw NUL bytes where the text meant the literal escape
      backslash-u0000 (Dev Notes: Context, classification table, and the same table's rendering). They
      date from the draft (edf0e97). Git therefore treats the story as binary: `git diff` prints
      "Bin", so review diffs of the story are unreadable.
    suggested_action: >-
      Replace each NUL byte with the six-character literal escape. Outside QA's write permission on
      story files (QA Results only).
    suggested_owner: sm
    refs: ['docs/stories/5.1.story.md']

resolved_issues:
  - id: 'DOC-006'
    severity: low
    finding: >-
      docs/architecture/error-handling-strategy.md, "Database Reconnection (Infinite Retry in DB
      Writer Goroutine)", showed a writer retrying every error indefinitely, contradicting §3.
    resolution: >-
      The sample now exits on errors.Is(err, database.ErrRejected), its comment says only transient
      failures are retried, and a lead-in paragraph links to §3 and names insertWithRetry as the
      shipped loop.
    verified_by: 'Quinn (Test Architect), 2026-09-17'
  - id: 'DOC-007'
    severity: low
    finding: >-
      docs/architecture/security.md, "Input Validation", showed json.Valid in an MQTT MessageHandler
      logging at WARN with the payload body.
    resolution: >-
      Section rewritten from the shipped code: validation in InsertMessage, the empty-payload skip
      and local json.Valid check quoted verbatim, write_rejected at ERROR without the body and why,
      server-side rejection (SQLSTATE class 22/23/54) listed. Heading kept, so the index.md anchor
      still resolves. A NUL byte introduced while editing was caught (git showed the file as binary)
      and replaced with the literal escape; the file is plain UTF-8 text again.
    verified_by: 'Quinn (Test Architect), 2026-09-17'

