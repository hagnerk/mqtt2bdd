waiver: { active: false }

top_issues:
  - id: "FIND-015"
    severity: low
    finding: "Silent message drop at shutdown. When a producer blocked on a full buffer unblocks via <-done (cmd/mqtt2bdd/main.go:122), its in-flight message is discarded with no log line. Dropping is the correct trade-off (the alternative was the FIND-014 panic), but the story's premise is 'no data is lost when the container is stopped', so the drop must be observable. Suggested: `case <-done: l.Warn(\"message dropped at shutdown, buffer was full\", \"topic\", topic)`."
    suggested_owner: dev
    refs: ["cmd/mqtt2bdd/main.go:118-123"]
  - id: "FIND-016"
    severity: low
    finding: "Drain path is not bounded by a context. insertWithRetry uses context.Background() (cmd/mqtt2bdd/main.go:37) and a bare time.Sleep (main.go:42). Consequences: (a) the drain cannot be cut short by done, burning a full 10s sleep per failing message inside the 30s window; (b) after the AC11 timeout, dbClient.Close() -> pgxpool.Close() blocks until in-flight queries return, so a hung (rather than refused) DB connection can push process exit past the 30s bound. Largely pre-existing (context.Background() in the write path dates from story 1.8/2.3), but story 2.4 is where it acquires a deadline to violate. Suggested: per-insert context.WithTimeout, and select on done instead of time.Sleep."
    suggested_owner: dev
    refs: ["cmd/mqtt2bdd/main.go:33-44", "cmd/mqtt2bdd/main.go:156"]

resolved_issues:
  - id: "FIND-014"
    severity: medium
    resolution: "Fixed in commit af378e4. close(msgChan) removed entirely (verified: the only closes in the tree are close(done) at main.go:141, defer close(drained) at main.go:146, and close(c.shutdown) at internal/mqtt/client.go:92). A dedicated done channel now signals shutdown; dbWriterLoop selects on msgChan/done and drains buffered messages via a non-blocking inner loop before exiting; the producer's full-buffer fallback selects on `msgChan <- msg` / `<-done`. The panic is eliminated by construction rather than by narrowing its window. AC4/AC5/AC6/AC7 semantics preserved."
    verified_by: "Quinn (Test Architect), 2026-07-25"
  - id: "FIND-013"
    severity: low
    resolution: "Recommend closing as not-a-defect. internal/config/config_test.go clears variables with t.Setenv(v, \"\"), and internal/config/config.go reads exclusively via os.Getenv (never os.LookupEnv), so unset and empty-string are indistinguishable to the code under test — the isolation is sound as written. Tests passed in mqtt2bdd-dev-go-dev (2026-06-21) and on the host (2026-07-25); the finding has never reproduced."
    verified_by: "Quinn (Test Architect), 2026-07-25"

