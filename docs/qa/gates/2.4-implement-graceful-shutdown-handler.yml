schema: 1
story: "2.4"
story_title: "Implement Graceful Shutdown Handler"
gate: CONCERNS
status_reason: "All 15 ACs implemented and toolchain is green in the dev container. One reachable reliability edge case: under a DB outage with a full buffer, close(msgChan) can panic a blocked MQTT producer goroutine instead of exiting gracefully via the timeout WARN path."
reviewer: "Quinn (Test Architect)"
updated: "2026-06-21T00:00:00Z"

waiver: { active: false }

top_issues:
  - id: "FIND-014"
    severity: medium
    finding: "Shutdown can panic with 'send on closed channel'. The MQTT message handler does a blocking send (cmd/mqtt2bdd/main.go:93) when the buffer is full. During shutdown, mqttClient.Disconnect() only quiesces 250ms; if the DB is down (dbWriterLoop stuck in its 10s retry) and the buffer is full, a Paho callback goroutine remains blocked on the send when close(msgChan) (main.go:111) executes, panicking the process. This is exactly the degraded scenario (DB down + sustained load) that the bounded shutdown timeout exists to handle gracefully."
    suggested_owner: dev
    refs: ["cmd/mqtt2bdd/main.go:87-95", "cmd/mqtt2bdd/main.go:111"]

