nfr_validation:
  security:
    status: PASS
    notes: "Unchanged from the previous review. The fix touches shutdown signalling only. No credential handling changes, no new attack surface."
  performance:
    status: PASS
    notes: "The select-per-message in dbWriterLoop replaces a range and is not measurable against a database round-trip. Startup bounded by defaultConnectTimeout (10s); shutdown bounded by defaultShutdownTimeout (30s) in all practical cases — see FIND-016 for the narrow exception."
  reliability:
    status: PASS
    notes: "Upgraded from CONCERNS. The send-on-closed-channel panic is eliminated by construction, and the compound degraded state (DB down + full buffer + shutdown) now resolves through the intended WARN-and-exit path. Ordered teardown, sync.Once-guarded MQTT shutdown, cancellable reconnectLoop, and the WaitGroup-vs-timeout race all remain correct. No new failure mode introduced by the fix."
  maintainability:
    status: PASS
    notes: "The insertWithRetry extraction states the retry policy once and shares it between the steady-state and drain paths, so the two cannot diverge. Comments explain why msgChan is never closed — the non-obvious invariant a future reader would otherwise undo. Named constants, three-block imports, consistent 'c' receiver, no panic()/magic numbers."

